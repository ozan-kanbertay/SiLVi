name: Build Electron App
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
jobs:
  build:
    name: Build for ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, ubuntu-24.04-arm, macos-latest, macos-26-intel ]
    runs-on: ${{ matrix.os }}
    permissions:
      actions: write
      contents: read
    environment: build
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
      - name: Setup macOS signing
        if: ${{ startsWith(matrix.os, 'macos-') }}
        # uses: apple-actions/import-codesign-certs@v6
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # create variables
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.provisionprofile
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # import certificate and provisioning profile from secrets
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          # create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # import certificate to keychain
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          # apply provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles
      - name: Install system dependencies
        if: ${{ startsWith(matrix.os, 'ubuntu-') }}
        run: |
          sudo apt update
          sudo apt install rpm squashfs-tools
          # sudo apt install -y \
          #   flatpak \
          #   flatpak-builder \
          #   elfutils
          # flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo
          # flatpak install --user -y flathub \
          #   org.freedesktop.Platform//25.08 \
          #   org.freedesktop.Sdk//25.08 \
          #   org.electronjs.Electron2.BaseApp//25.08
      - name: Update npm
        run: npm install -g npm@11.6.2
      - name: Show tool versions
        run: |
          node --version
          npm --version
      - name: Install node dependencies
        env:
          ONNXRUNTIME_NODE_INSTALL: skip  # Skip CUDA installation to prevent dependency issues
        run: npm ci --verbose
      - name: Make distributables
        run: npm run make --verbose
        # env:
          # APPLE_ID_EMAIL: ${{ secrets.APPLE_ID_EMAIL }}
          # APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: build-artifacts-${{ matrix.os }}-${{ github.run_id }}
          path: out/make/**
  release:
    name: Release as draft
    permissions:
      contents: write
    needs: [ build ]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3.0.0
        with:
          overwrite_files: false
          files: |
            dist/**/**
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
